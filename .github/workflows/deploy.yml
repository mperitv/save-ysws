name: Deploy save-website to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Create deployment directory with correct structure
        run: |
          mkdir -p deploy
          # Copy all files from save-website to root of deploy
          cp -r save-website/* deploy/
          # Copy save-assets folder alongside the files
          cp -r save-assets deploy/
          # List directory structure for debugging
          ls -la deploy/
          ls -la deploy/save-assets/
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
